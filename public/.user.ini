; PHP's upload limits for the platform. PHP drops a file over its own limit before the
; platform sees it, so these sit above the platform's 20 MB (OHA_MAX_UPLOAD_KB); a whole
; form may carry a file and its fields. Read by PHP on cPanel (PHP-FPM, CGI); the upload
